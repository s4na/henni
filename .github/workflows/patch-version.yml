name: Stamp gem patch version
on:
  push:
    branches: [main]

permissions: {}

jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp and build the gem
        run: |
          ruby script/stamp_version.rb
          gem build henni.gemspec --strict --output "$RUNNER_TEMP/henni.gem"
      - name: Commit the version to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION Gemfile.lock
          git commit -m "Stamp henni $(head -n 1 VERSION) for $GITHUB_SHA"
          gh auth setup-git
          if ! git push origin HEAD:refs/heads/main; then
            remote_head=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
            if [[ "$remote_head" == "$GITHUB_SHA" ]]; then
              exit 1
            fi
            echo 'Main has advanced; its newer push owns the version stamp.'
          fi
