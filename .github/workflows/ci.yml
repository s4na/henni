name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow syntax and shell scripts with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: v1.32.0
          advanced-security: false

  ruby-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: '3.4'
      - name: Lint Ruby source, specs, and example applications
        run: gem exec -v 1.92.3 rubocop --lint --enable-pending-cops lib exe/henni Gemfile henni.gemspec script spec examples

  ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        ruby: ['3.4', '4.0']
        minitest: ['6.1.0']
        include:
          - ruby: '3.4'
            minitest: '5.25.4'
    env:
      HENNI_TEST_MINITEST: ${{ matrix.minitest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: ${{ matrix.minitest != '5.25.4' }}
      # Capybara 3.40's storage reset sends an origin wildcard rejected by Chrome 158.
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          chrome-version: '157'
          install-chromedriver: true
      - name: Install the Minitest 5 compatibility bundle
        if: matrix.minitest == '5.25.4'
        run: bundle install
      - name: Run gem specs and both complete Rails suites
        env:
          SE_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bundle exec rspec --format documentation
      - run: gem build henni.gemspec --strict
